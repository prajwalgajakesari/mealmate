name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type check (TypeScript services)
        run: pnpm turbo type-check --filter='./services/user-service' --filter='./services/order-orchestrator' --filter='./apps/whatsapp-bot' --filter='./packages/shared-types'

      - name: Lint (TypeScript)
        run: pnpm turbo lint --filter='./services/user-service' --filter='./services/order-orchestrator'

  test-python-services:
    name: Test Python Services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mealmate_test
          POSTGRES_USER: mealmate
          POSTGRES_PASSWORD: mealmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Meal Engine dependencies
        working-directory: services/meal-engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Test Meal Engine
        working-directory: services/meal-engine
        env:
          DATABASE_URL: postgresql://mealmate:mealmate_test@localhost:5432/mealmate_test
          REDIS_URL: redis://localhost:6379/0
          ANTHROPIC_API_KEY: test-key
        run: pytest tests/ -v --tb=short

      - name: Install Pantry Tracker dependencies
        working-directory: services/pantry-tracker
        run: pip install -e ".[test]"

      - name: Test Pantry Tracker
        working-directory: services/pantry-tracker
        env:
          DATABASE_URL: postgresql://mealmate:mealmate_test@localhost:5432/mealmate_test
          REDIS_URL: redis://localhost:6379/1
        run: pytest tests/ -v --tb=short

  test-node-services:
    name: Test Node Services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mealmate_test
          POSTGRES_USER: mealmate
          POSTGRES_PASSWORD: mealmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Test User Service
        env:
          DATABASE_URL: postgresql://mealmate:mealmate_test@localhost:5432/mealmate_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret
        run: pnpm --filter @mealmate/user-service test

      - name: Test Order Orchestrator
        env:
          DATABASE_URL: postgresql://mealmate:mealmate_test@localhost:5432/mealmate_test
          REDIS_URL: redis://localhost:6379/1
        run: pnpm --filter @mealmate/order-orchestrator test

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-python-services, test-node-services]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - services/meal-engine
          - services/pantry-tracker
          - services/order-orchestrator
          - services/user-service
          - apps/whatsapp-bot

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mealmate/${{ matrix.service }} ./${{ matrix.service }}
