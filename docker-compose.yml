services:
  postgres:
    image: postgres:16-alpine
    container_name: mealmate-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mealmate
      POSTGRES_USER: mealmate
      POSTGRES_PASSWORD: mealmate_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealmate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mealmate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meal-engine:
    build:
      context: ./services/meal-engine
      dockerfile: Dockerfile
    container_name: mealmate-meal-engine
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://mealmate:mealmate_dev@postgres:5432/mealmate
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/meal-engine:/app

  pantry-tracker:
    build:
      context: ./services/pantry-tracker
      dockerfile: Dockerfile
    container_name: mealmate-pantry-tracker
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://mealmate:mealmate_dev@postgres:5432/mealmate
      REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/pantry-tracker:/app

  order-orchestrator:
    build:
      context: ./services/order-orchestrator
      dockerfile: Dockerfile
    container_name: mealmate-order-orchestrator
    ports:
      - "8003:3000"
    environment:
      DATABASE_URL: postgresql://mealmate:mealmate_dev@postgres:5432/mealmate
      REDIS_URL: redis://redis:6379/2
      MEAL_ENGINE_URL: http://meal-engine:8000
      PANTRY_TRACKER_URL: http://pantry-tracker:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/order-orchestrator:/app

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: mealmate-user-service
    ports:
      - "8004:3000"
    environment:
      DATABASE_URL: postgresql://mealmate:mealmate_dev@postgres:5432/mealmate
      REDIS_URL: redis://redis:6379/3
      JWT_SECRET: ${JWT_SECRET:-mealmate_jwt_dev_secret_change_in_prod}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/user-service:/app

volumes:
  postgres_data:
  redis_data:
